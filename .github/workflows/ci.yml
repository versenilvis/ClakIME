name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
            cli/target/
            diagnostics/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          cargo fmt --manifest-path diagnostics/Cargo.toml -- --check
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo fmt --manifest-path ui/Cargo.toml -- --check

      - name: Run clippy linter
        run: |
          cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
          cargo clippy --manifest-path diagnostics/Cargo.toml -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run tests
        run: |
          cargo test --manifest-path engine/Cargo.toml --verbose
          cargo test --manifest-path diagnostics/Cargo.toml --verbose
          cargo test --manifest-path cli/Cargo.toml --verbose

  check-msrv:
    name: Check MSRV (1.85 & 1.92)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies for UI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libfontconfig1-dev

      - name: Install MSRV toolchains
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.92.0 --profile minimal

      - name: Check MSRV for engine, cli, diagnostics (1.85.0)
        run: |
          for c in engine diagnostics cli; do
            cargo +1.85.0 test --no-run --locked --all-targets --manifest-path $c/Cargo.toml
          done

      - name: Check MSRV for ui (1.92.0)
        run: |
          cargo +1.92.0 test --no-run --locked --all-targets --manifest-path ui/Cargo.toml

  build-distros:
    name: Build & Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm --needed \
                base-devel cmake ninja extra-cmake-modules fcitx5 libinput rustup git nodejs gtest
              rustup default stable
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr"
            test_gui: true
          - distro: ubuntu
            image: ubuntu:24.04
            setup: |
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential cmake ninja-build extra-cmake-modules pkg-config \
                libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
                libinput-dev libudev-dev curl git libgtest-dev
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
          - distro: fedora
            image: fedora:latest
            setup: |
              dnf install -y \
                gcc-c++ cmake ninja-build extra-cmake-modules fcitx5-devel \
                libinput-devel systemd-devel pkgconfig curl git gtest-devel
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.setup }}

      - name: Build Clak
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export RUSTUP_AUTO_INSTALL=0
          cmake -B build -G Ninja ${{ matrix.cmake_args }}
          cmake --build build -j$(nproc)

      - name: Run C++ test suite
        run: |
          if cmake --build build --target clak_cpp_tests; then
            ./build/src/tests/clak_cpp_tests
          fi

      - name: Test installation
        run: |
          DESTDIR=/tmp/clak-install cmake --install build
          FCITX5_ADDON_DIR=""
          if command -v rpm >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(rpm -ql fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | xargs dirname)
          elif command -v dpkg >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(dpkg -L fcitx5-modules fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | xargs dirname || true)
          elif command -v pacman >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(pacman -Ql fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | awk '{print $2}' | xargs dirname)
          fi
          echo "Distro fcitx5 addon directory: ${FCITX5_ADDON_DIR}"
          test -n "${FCITX5_ADDON_DIR}"
          test -f "/tmp/clak-install${FCITX5_ADDON_DIR}/libclak.so"
          test -f /tmp/clak-install/usr/share/fcitx5/addon/clak.conf
          test -f /tmp/clak-install/usr/share/fcitx5/inputmethod/clak.conf
          if [ "${{ matrix.test_gui }}" = "true" ]; then
            test -f /tmp/clak-install/usr/bin/clak-gui
          fi

      - name: Test script simulations
        run: |
          bash scripts/install.sh --dry-run
          bash scripts/uninstall.sh --dry-run

  check-nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check Nix Flake
        run: nix flake check

      - name: Build Clak via Nix
        run: nix build
