name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "assets/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "assets/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Verify panic strategy is unwind
        run: |
          if grep -rE 'panic\s*=\s*"abort"' Cargo.toml engine/ cli/ diagnostics/ ui/ 2>/dev/null; then
            echo "ERROR: panic = 'abort' found in Cargo.toml files! This breaks catch_unwind in C ABI and crashes fcitx5 daemon on panic."
            exit 1
          fi
          if [ -d .cargo ] && grep -rE 'panic\s*=\s*"abort"|-C\s*panic=abort' .cargo/ 2>/dev/null; then
            echo "ERROR: panic=abort found in .cargo config! This breaks catch_unwind in C ABI."
            exit 1
          fi
          if echo "${RUSTFLAGS:-}" | grep -E 'panic=abort'; then
            echo "ERROR: panic=abort found in RUSTFLAGS environment variable!"
            exit 1
          fi

      - name: Run clippy linter
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

  check-msrv:
    name: Check MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 1.85.0
            packages: "-p clak-engine -p clak-diagnostics -p clak"
            needs_gui_deps: false
          - toolchain: 1.92.0
            packages: "-p clak-gui"
            needs_gui_deps: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies for UI
        if: matrix.needs_gui_deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.toolchain }}

      - name: Check MSRV
        run: cargo +${{ matrix.toolchain }} test --no-run --locked --all-targets ${{ matrix.packages }}

  build-distros:
    name: Build & Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm --needed \
                base-devel cmake ninja extra-cmake-modules fcitx5 libinput rustup git nodejs gtest fontconfig ccache
              rustup default stable
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr"
            test_gui: true
          - distro: ubuntu
            image: ubuntu:24.04
            setup: |
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build extra-cmake-modules pkg-config \
                libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
                fcitx5 fcitx5-modules \
                libinput-dev libudev-dev libxcb1-dev curl git libgtest-dev ccache ca-certificates
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
          - distro: fedora
            image: fedora:latest
            setup: |
              dnf install -y --setopt=install_weak_deps=False \
                gcc-c++ cmake ninja-build extra-cmake-modules fcitx5 fcitx5-devel \
                libinput-devel systemd-devel libxcb-devel pkgconfig curl git gtest-devel ccache
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup show
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ccache & cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.distro }}-build-${{ hashFiles('**/Cargo.lock', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.distro }}-build-

      - name: Install dependencies
        run: ${{ matrix.setup }}

      - name: Build Clak
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export RUSTUP_AUTO_INSTALL=0
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="500M"
          export CCACHE_COMPRESS="true"
          mkdir -p "$CCACHE_DIR"
          ccache -z
          cmake -B build -G Ninja ${{ matrix.cmake_args }}
          cmake --build build -j$(nproc)
          ccache -s

      - name: Run C++ test suite
        run: |
          if cmake --build build --target clak_cpp_tests; then
            ./build/src/tests/clak_cpp_tests
          fi

      - name: Test installation
        run: |
          DESTDIR=/tmp/clak-install cmake --install build
          FCITX5_ADDON_DIR=""
          if command -v rpm >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(rpm -ql fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | xargs dirname)
          elif command -v dpkg >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(dpkg -L fcitx5-modules fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | xargs dirname || true)
          elif command -v pacman >/dev/null 2>&1; then
            FCITX5_ADDON_DIR=$(pacman -Ql fcitx5 2>/dev/null | grep 'libclassicui\.so' | head -1 | awk '{print $2}' | xargs dirname)
          fi
          echo "Distro fcitx5 addon directory: ${FCITX5_ADDON_DIR}"
          test -n "${FCITX5_ADDON_DIR}"
          test -f "/tmp/clak-install${FCITX5_ADDON_DIR}/libclak.so"
          test -f /tmp/clak-install/usr/share/fcitx5/addon/clak.conf
          test -f /tmp/clak-install/usr/share/fcitx5/inputmethod/clak.conf
          if [ "${{ matrix.test_gui }}" = "true" ]; then
            test -f /tmp/clak-install/usr/bin/clak-gui
          fi

      - name: Test script simulations
        run: |
          bash scripts/install.sh --dry-run
          bash scripts/uninstall.sh --dry-run
