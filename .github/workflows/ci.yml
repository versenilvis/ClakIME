name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
            cli/target/
            diagnostics/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          cargo fmt --manifest-path diagnostics/Cargo.toml -- --check
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo fmt --manifest-path ui/Cargo.toml -- --check

      - name: Run clippy linter
        run: |
          cargo clippy --manifest-path engine/Cargo.toml -- -D warnings
          cargo clippy --manifest-path diagnostics/Cargo.toml -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run tests
        run: |
          cargo test --manifest-path engine/Cargo.toml --verbose
          cargo test --manifest-path diagnostics/Cargo.toml --verbose
          cargo test --manifest-path cli/Cargo.toml --verbose

  build-distros:
    name: Build & Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm --needed \
                base-devel cmake ninja extra-cmake-modules fcitx5 libinput rust git nodejs
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr"
            test_gui: true
          - distro: ubuntu
            image: ubuntu:24.04
            setup: |
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential cmake ninja-build extra-cmake-modules pkg-config \
                libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
                libinput-dev libudev-dev curl git
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
          - distro: fedora
            image: fedora:latest
            setup: |
              dnf install -y \
                gcc-c++ cmake ninja-build extra-cmake-modules fcitx5-devel \
                libinput-devel systemd-devel pkgconfig cargo rust git
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_GUI=OFF"
            test_gui: false
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.setup }}

      - name: Build Clak
        run: |
          cmake -B build -G Ninja ${{ matrix.cmake_args }}
          cmake --build build -j$(nproc)

      - name: Run C++ test suite
        run: ./build/src/tests/clak_cpp_tests

      - name: Test installation
        run: |
          DESTDIR=/tmp/clak-install cmake --install build
          test -f /tmp/clak-install/usr/lib/fcitx5/libclak.so || test -f /tmp/clak-install/usr/lib/*-linux-gnu/fcitx5/libclak.so || test -f /tmp/clak-install/usr/lib64/fcitx5/libclak.so
          test -f /tmp/clak-install/usr/share/fcitx5/addon/clak.conf
          test -f /tmp/clak-install/usr/share/fcitx5/inputmethod/clak.conf
          if [ "${{ matrix.test_gui }}" = "true" ]; then
            test -f /tmp/clak-install/usr/bin/clak-gui
          fi

      - name: Test installer simulation
        run: bash scripts/install.sh --dry-run

  check-nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check Nix Flake
        run: nix flake check

      - name: Build Clak via Nix
        run: nix build
