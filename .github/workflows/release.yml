name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            extra-cmake-modules \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            libinput-dev \
            libudev-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            pkg-config \
            git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/cargo-target/
          key: ${{ runner.os }}-build-ubuntu-${{ hashFiles('engine/Cargo.lock', 'ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-ubuntu-

      - name: Run engine tests
        run: cargo test --manifest-path engine/Cargo.toml --verbose

      - name: Build Clak
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Create release bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DESTDIR=/tmp/clak-dist cmake --install build
          if [ -f /tmp/clak-dist/usr/lib/x86_64-linux-gnu/fcitx5/libclak.so ] && [ ! -f /tmp/clak-dist/usr/lib/fcitx5/libclak.so ]; then
            mkdir -p /tmp/clak-dist/usr/lib/fcitx5
            cp -a /tmp/clak-dist/usr/lib/x86_64-linux-gnu/fcitx5/libclak.so /tmp/clak-dist/usr/lib/fcitx5/libclak.so
          elif [ -f /tmp/clak-dist/usr/lib/fcitx5/libclak.so ] && [ ! -f /tmp/clak-dist/usr/lib/x86_64-linux-gnu/fcitx5/libclak.so ]; then
            mkdir -p /tmp/clak-dist/usr/lib/x86_64-linux-gnu/fcitx5
            cp -a /tmp/clak-dist/usr/lib/fcitx5/libclak.so /tmp/clak-dist/usr/lib/x86_64-linux-gnu/fcitx5/libclak.so
          fi
          mkdir -p dist
          XZ_OPT="-9e -T0" tar -C /tmp/clak-dist -cJf dist/clak-${VERSION}-linux-x86_64.tar.xz usr/
          tar -C /tmp/clak-dist -czf dist/clak-${VERSION}-linux-x86_64.tar.gz usr/

          # Build .deb package for Debian/Ubuntu
          DEB_ROOT=/tmp/clak-deb
          rm -rf "$DEB_ROOT"
          mkdir -p "$DEB_ROOT/DEBIAN"
          cp -r /tmp/clak-dist/usr "$DEB_ROOT/"
          sed "s/@VERSION@/${VERSION}/g" packaging/debian/control.in > "$DEB_ROOT/DEBIAN/control"
          cp packaging/debian/postinst "$DEB_ROOT/DEBIAN/postinst"
          chmod 755 "$DEB_ROOT/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$DEB_ROOT" "dist/clak_${VERSION}_amd64.deb"

      - name: Create vendor tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo vendor vendor/ --manifest-path engine/Cargo.toml
          tar -czf dist/clak-${VERSION}-vendor.tar.gz vendor/
          rm -rf vendor/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Generate Release Notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release-notes.outputs.content }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to main branch
        run: git checkout main

      - name: Update Full CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged, nothing to commit"
          else
            git commit -m "docs(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi

  deploy-aur:
    name: Deploy to AUR
    needs: publish
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update PKGBUILD versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur-bin/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur-bin/PKGBUILD

      - name: Publish clak to AUR
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: clak
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/clak.install
          commit_username: "verse"
          commit_email: "versedev.store@proton.me"
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "release: update to ${GITHUB_REF_NAME}"

      - name: Publish clak-bin to AUR
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: clak-bin
          pkgbuild: packaging/aur-bin/PKGBUILD
          assets: packaging/aur-bin/clak-bin.install
          commit_username: "verse"
          commit_email: "versedev.store@proton.me"
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "release: update to ${GITHUB_REF_NAME}"
