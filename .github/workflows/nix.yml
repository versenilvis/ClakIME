name: Nix

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/nix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flake Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build flake package
        run: nix build .#default -L
