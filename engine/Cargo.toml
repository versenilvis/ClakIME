[package]
name = "clak-engine"
version = "0.8.2"
edition = "2021"
rust-version = "1.85.0"
description = "Vietnamese input method engine"
license = "0BSD"
keywords = ["vietnamese", "ime", "telex", "vni", "input-method"]
categories = ["text-processing", "internationalization"]

[lib]
name = "clak_engine"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "engine_bench"
harness = false

[lints.clippy]
missing_safety_doc = "allow"
ptr_arg = "allow"
needless_range_loop = "allow"


