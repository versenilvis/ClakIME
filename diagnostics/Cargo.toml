[package]
name = "clak-diagnostics"
version = "0.3.2"
edition = "2021"
rust-version = "1.85.0"
description = "Diagnostic inspection library for Clak Vietnamese Input Method"
license = "0BSD"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clak-engine = { path = "../engine" }

[dev-dependencies]
tempfile = "3"

