[workspace]
members = [
    "engine",
    "diagnostics",
    "cli",
    "ui",
]
resolver = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release.package.clak-gui]
opt-level = "z"

[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-dist.package.clak-gui]
opt-level = "z"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.prof]
inherits = "release"
debug = "line-tables-only"
strip = false
