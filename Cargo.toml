[workspace]
members = [
    "engine",
    "diagnostics",
    "cli",
    "ui",
]
resolver = "2"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.clak-gui]
opt-level = "z"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
