[package]
name = "clak"
version = "0.3.2"
edition = "2021"
description = "Command line interface for Clak Vietnamese Input Method"
license = "0BSD"

[[bin]]
name = "clak"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clak-diagnostics = { path = "../diagnostics" }
serde_json = "1.0"
libc = "0.2"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
