[package]
name = "clak"
version = "0.3.2"
edition = "2021"
rust-version = "1.85.0"
description = "Command line interface for Clak Vietnamese Input Method"
license = "0BSD"

[[bin]]
name = "clak"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clak-diagnostics = { path = "../diagnostics" }
serde_json = "1.0"
libc = "0.2"

